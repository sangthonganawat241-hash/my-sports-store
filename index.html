<!DOCTYPE html>
<html lang="th" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AETHER SPORTS - Next Gen Gear</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { brand: { accent: '#3b82f6' } } } }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col">

  <header class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-white text-slate-900 rounded font-black text-xl flex items-center justify-center border-2 border-blue-500">A</div>
        <span class="text-xl font-extrabold tracking-wider">AETHER <span class="text-blue-500 text-xs">SPORTS</span></span>
      </div>
      <button onclick="toggleCart()" class="relative p-2.5 rounded-full bg-blue-500 text-white">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="cart-count" class="absolute -top-1 -right-1 bg-red-500 text-white text-[11px] font-bold w-5 h-5 rounded-full flex items-center justify-center">0</span>
      </button>
    </div>
  </header>

  <section class="py-16 text-center border-b border-slate-800 bg-gradient-to-b from-blue-950/30 to-transparent">
    <h1 class="text-4xl md:text-6xl font-black mb-4">ปลดล็อกขีดจำกัด <br><span class="text-blue-500">ด้วยอุปกรณ์กีฬาระดับโปร</span></h1>
    <p class="text-slate-400 text-sm md:text-base max-w-xl mx-auto">ยินดีต้อนรับสู่ AETHER SPORTS ร้านค้าอุปกรณ์กีฬาครบวงจร</p>
  </section>

  <section class="max-w-7xl mx-auto px-4 py-12 flex-grow">
    <h2 class="text-2xl font-bold mb-6">สินค้าแนะนำ</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="product-list"></div>
  </section>

  <!-- CART MODAL -->
  <div id="cart-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold">ตะกร้าสินค้า</h3>
        <button onclick="toggleCart()" class="text-slate-400"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <div id="cart-items" class="space-y-3 mb-4 max-h-60 overflow-y-auto"></div>
      <div class="flex justify-between font-bold mb-4"><span>รวมทั้งหมด:</span><span id="cart-total" class="text-blue-500">0 ฿</span></div>
      <button onclick="checkout()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2.5 rounded-xl">ชำระเงิน</button>
    </div>
  </div>

  <script>
    const products = [
      { id: 1, name: 'ดัมเบลปรับน้ำหนัก Pro-Hex 24kg', price: 4200, img: 'https://images.unsplash.com/photo-1583454110551-21f2fa2afe61?w=500' },
      { id: 2, name: 'รองเท้าวิ่ง Carbon-Fly', price: 5400, img: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500' },
      { id: 3, name: 'ไม้เทนนิส Raptor GT', price: 6200, img: 'https://images.unsplash.com/photo-1617083934555-ac7d4fed8814?w=500' },
      { id: 4, name: 'บาสเกตบอล Indoor', price: 2100, img: 'https://images.unsplash.com/photo-1519861531473-9200262188bf?w=500' }
    ];
    let cart = [];

    function renderProducts() {
      document.getElementById('product-list').innerHTML = products.map(p => `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between">
          <img src="${p.img}" class="w-full h-40 object-cover rounded-xl mb-3">
          <h3 class="font-bold text-sm mb-2">${p.name}</h3>
          <div class="flex justify-between items-center">
            <span class="text-blue-500 font-bold">${p.price.toLocaleString()} ฿</span>
            <button onclick="addToCart(${p.id})" class="bg-blue-500 text-white text-xs px-3 py-1.5 rounded-lg">เพิ่ม</button>
          </div>
        </div>
      `).join('');
    }

    function addToCart(id) {
      cart.push(products.find(p => p.id === id));
      updateCart();
    }

    function updateCart() {
      document.getElementById('cart-count').innerText = cart.length;
      document.getElementById('cart-items').innerHTML = cart.map(i => `
        <div class="flex justify-between text-xs bg-slate-800 p-2 rounded">
          <span>${i.name}</span><span class="text-blue-400">${i.price} ฿</span>
        </div>
      `).join('');
      const total = cart.reduce((sum, i) => sum + i.price, 0);
      document.getElementById('cart-total').innerText = total.toLocaleString() + ' ฿';
    }

    function toggleCart() { document.getElementById('cart-modal').classList.toggle('hidden'); }
    function checkout() { alert('เปิดระบบชำระเงินเรียบร้อย!'); }

    renderProducts();
  </script>
</body>
</html>
